<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}SymptoSphere 2.0 · Symptom intelligence{% endblock %}</title>
<meta name="description" content="Educational symptom exploration with explicit uncertainty and optional 3D anatomy navigation.">
<link rel="icon" href="{{url_for('static',filename='assets/mark.svg')}}" type="image/svg+xml">
<link rel="stylesheet" href="{{url_for('static',filename='css/style.css')}}"></head>
<body><a class="skip-link" href="#main">Skip to content</a><header class="site-header"><div class="header-inner">
<a class="brand" href="/"><span class="brand-mark" aria-hidden="true">✦</span><span>Sympto<span class="teal">Sphere</span><small>SYMPTOM INTELLIGENCE</small></span><span class="version">2.0</span></a>
<nav aria-label="Main navigation"><a href="/" data-i18n="nav_home">Home</a><a href="/predict" data-i18n="nav_explore">Explore symptoms</a><a href="/about" data-i18n="nav_about">About & evidence</a></nav>
<button id="languageToggle" class="button small secondary" aria-label="Switch English or Hindi">EN / हिन्दी</button></div></header>
<main id="main" class="container">{% block content %}{% endblock %}</main>
<footer class="footer container"><span>SymptoSphere 2.0 <span class="muted">· Educational research prototype</span></span><span data-i18n="disclaimer">Synthetic data. Limited scope. Not a diagnosis.</span></footer>
<script src="{{url_for('static',filename='js/lang.js')}}" defer></script>{% block scripts %}{% endblock %}</body></html>
